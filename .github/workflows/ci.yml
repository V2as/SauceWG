name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Import the application
        working-directory: backend
        env:
          JWT_SECRET: ci
          ADMIN_PASSWORD: ci-password
          POSTGRES_PASSWORD: ci
          AWG_ENDPOINT_HOST: 127.0.0.1
        run: python -c "from app.main import app; print(len(app.routes), 'routes registered')"

      # Adding and removing an exit node is file exchange with the node container,
      # so the whole path runs against a stub — no Docker and no database.
      - name: The exit node API adds and removes nodes
        run: |
          pip install httpx
          ./scripts/test-node-api.py

      # `saucewg recover` runs this, because recovering an exit node needs the panel's
      # SSH key and the panel is the only container that has it. With no state file
      # there is nothing unhealthy to work on, which is the answer it has to give
      # rather than a traceback.
      - name: The panel CLI can be asked to recover exit nodes
        working-directory: backend
        env:
          JWT_SECRET: ci
          ADMIN_PASSWORD: ci-password
          POSTGRES_PASSWORD: ci
          AWG_ENDPOINT_HOST: 127.0.0.1
        run: python -m app.cli recover | jq -e 'length == 0'

  # The bypass relay decides whether a destination the network drops is reachable,
  # and it decides it with concurrency: several handshakes outstanding, the first
  # answer kept, the rest closed. None of that can be seen from the outside — a
  # leak here is a socket per connection and a wrong answer is a service that
  # silently stays blocked — so it is tested against a faked censor.
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: docker/awg/bypass/go.mod
      - name: The relay is formatted, vetted and tested
        working-directory: docker/awg/bypass
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; echo "::error::gofmt"; exit 1; }
          go vet ./...
          go test -race -count=1 ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning saucewg.sh docker/*/*.sh scripts/*.sh
      - name: saucewg.sh answers for every documented command
        run: |
          bash saucewg.sh help
          bash saucewg.sh version --json | jq -e '.cli_version'
          bash saucewg.sh --json signatures | jq -e '.presets | length >= 5'
          # Commands that need an installation must say so rather than crash.
          bash saucewg.sh --dir /tmp/nowhere status 2>&1 | grep -q "not installed"
          bash saucewg.sh --dir /tmp/nowhere protocol 2>&1 | grep -q "not installed"

      # The node container, the panel and the installer each carry their own copy of
      # the generation table. When they disagree the tunnel comes up and never
      # handshakes, which is not an error anywhere — so it is checked instead.
      - name: The AmneziaWG generation tables agree
        run: ./scripts/test-protocol-parity.sh

      # The reload path decides whether a running tunnel survives an edit to the
      # exit node list, so it is tested with the system calls stubbed out.
      - name: The node container reloads without dropping uplinks
        run: ./scripts/test-uplinks.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the repository compose files
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-password/;
                  s/^JWT_SECRET=.*/JWT_SECRET=ci-secret/;
                  s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/;
                  s/^AWG_ENDPOINT_HOST=.*/AWG_ENDPOINT_HOST=127.0.0.1/' .env
          docker compose --env-file .env config >/dev/null
          docker compose -f docker-compose.exit.yml --env-file .env.exit.example config >/dev/null
          echo "compose files are valid"

      # saucewg.sh writes its own compose files so a bare server can be installed
      # with nothing but curl. They have to stay valid and offer the same services
      # as the ones in the repository.
      - name: Validate the compose files saucewg.sh generates
        run: |
          sudo bash saucewg.sh --dir /tmp/entry --yes install \
            --endpoint-host 127.0.0.1 --admin-password ci-password --no-start
          sudo docker compose --project-directory /tmp/entry \
            -f /tmp/entry/docker-compose.yml --env-file /tmp/entry/.env config >/dev/null
          for service in postgres awg panel caddy; do
            sudo docker compose --project-directory /tmp/entry \
              -f /tmp/entry/docker-compose.yml --env-file /tmp/entry/.env config --services \
              | grep -qx "$service" || { echo "::error::generated compose is missing $service"; exit 1; }
          done
          echo "the generated entry compose file is valid"

          sudo bash saucewg.sh --dir /tmp/exit --yes install-node \
            --name ci-exit --endpoint-host 127.0.0.1 --no-start
          sudo docker compose --project-directory /tmp/exit \
            -f /tmp/exit/docker-compose.yml --env-file /tmp/exit/.env config >/dev/null
          echo "the generated exit compose file is valid"

          # --domain is the branch that shipped broken. It was never installed in CI, so
          # the one value it writes differently was never handed to Caddy by anything.
          sudo bash saucewg.sh --dir /tmp/entry-tls --yes install \
            --domain panel.example.com --endpoint-host 127.0.0.1 \
            --admin-password ci-password --no-start
          sudo docker compose --project-directory /tmp/entry-tls \
            -f /tmp/entry-tls/docker-compose.yml --env-file /tmp/entry-tls/.env config >/dev/null
          sudo grep -qx 'PANEL_SITE_ADDRESS=panel.example.com' /tmp/entry-tls/.env \
            || { echo "::error::--domain did not reach PANEL_SITE_ADDRESS"; exit 1; }
          echo "installing with --domain writes a valid configuration"

      # Whether that configuration is one Caddy will load is decided when the container
      # starts, not when the image is built: a value the global options block rejects is
      # `caddy run` exiting before it binds a port, restarted forever, while the panel and
      # the database stay healthy. Nothing above would notice, so every value the
      # installer and the documentation can produce is adapted against the real image.
      - name: The web container accepts every CADDY_AUTO_HTTPS the tree writes
        run: ./scripts/test-caddy-config.sh

      # A generation is decided by which obfuscation parameters the .env carries, and
      # an I1 signature spec contains spaces and angle brackets — so it has to survive
      # both the .env writer and compose's own interpolation.
      - name: The installer writes a loadable profile for every generation
        run: |
          for version in 1.0 1.5 2.0; do
            sudo rm -rf /tmp/gen
            sudo bash saucewg.sh --dir /tmp/gen --yes install-node \
              --name ci-gen --endpoint-host 127.0.0.1 --protocol "$version" --no-start
            sudo grep -qx "AWG_PROTOCOL=$version" /tmp/gen/.env \
              || { echo "::error::$version was not recorded in .env"; exit 1; }
            resolved=$(sudo docker compose --project-directory /tmp/gen \
              -f /tmp/gen/docker-compose.yml --env-file /tmp/gen/.env config --format json \
              | jq -r '.services.awg.environment')
            for param in $(jq -rn --arg v "$version" '
                  {"1.0": [], "1.5": ["AWG_I1"], "2.0": ["AWG_I1","AWG_S3","AWG_S4"]}[$v][]'); do
              printf '%s' "$resolved" | jq -e --arg p "$param" '(.[$p] // "") != ""' >/dev/null \
                || { echo "::error::$version is missing $param"; exit 1; }
            done
            for param in $(jq -rn --arg v "$version" '
                  {"1.0": ["AWG_I1","AWG_S3","AWG_S4"], "1.5": ["AWG_S3","AWG_S4"], "2.0": []}[$v][]'); do
              printf '%s' "$resolved" | jq -e --arg p "$param" '(.[$p] // "") == ""' >/dev/null \
                || { echo "::error::$version should not carry $param"; exit 1; }
            done
            echo "AmneziaWG $version reaches the container intact"
          done

          # Moving a node between generations is the upgrade path, so it has to add and
          # drop the right parameters rather than leave a mixture of the two.
          sudo rm -rf /tmp/gen
          sudo bash saucewg.sh --dir /tmp/gen --yes install-node \
            --name ci-gen --endpoint-host 127.0.0.1 --protocol 1.0 --no-start
          s1=$(sudo sed -n 's/^AWG_S1=//p' /tmp/gen/.env)
          sudo bash saucewg.sh --dir /tmp/gen --yes set-protocol 2.0 --signature dns --no-restart
          sudo grep -qx "AWG_S1=$s1" /tmp/gen/.env \
            || { echo "::error::padding both ends agree on was regenerated"; exit 1; }
          sudo grep -q '^AWG_S3=[0-9]' /tmp/gen/.env \
            || { echo "::error::moving to 2.0 did not add S3"; exit 1; }
          sudo bash saucewg.sh --dir /tmp/gen --yes set-protocol 1.0 --no-restart
          sudo grep -qx 'AWG_S3=' /tmp/gen/.env \
            || { echo "::error::moving back to 1.0 left S3 behind"; exit 1; }
          sudo grep -qx 'AWG_I1=' /tmp/gen/.env \
            || { echo "::error::moving back to 1.0 left a signature behind"; exit 1; }
          echo "set-protocol moves a node cleanly in both directions"

      # An interface app clients dial has to pad by zero: the AmneziaVPN app drops non-zero
      # S3/S4, so the handshake completes and every transport packet it sends is discarded
      # as malformed. A node-to-node hop runs amneziawg-go at both ends and keeps real
      # padding, which is the hop a censor sees anyway.
      - name: Client-facing padding stays zero while node-to-node padding does not
        run: |
          for param in S3 S4; do
            sudo grep -qx "AWG_${param}=0" /tmp/entry/.env \
              || { echo "::error::the entry node pads app clients with $param"; exit 1; }
            sudo grep -qE "^AWG_${param}=[1-9][0-9]*$" /tmp/exit/.env \
              || { echo "::error::the exit node does not pad its uplink with $param"; exit 1; }
          done
          echo "an entry node pads clients by zero and an exit node pads its uplink for real"

          # A generation change must keep that split, or it breaks every app client at once.
          sudo bash saucewg.sh --dir /tmp/entry --yes set-protocol 1.5 --no-restart
          sudo bash saucewg.sh --dir /tmp/entry --yes set-protocol 2.0 --no-restart
          for param in S3 S4; do
            sudo grep -qx "AWG_${param}=0" /tmp/entry/.env \
              || { echo "::error::set-protocol gave the entry node non-zero $param"; exit 1; }
          done
          echo "set-protocol keeps a client-facing interface padding by zero"

      # The cascade list is what the panel and the CLI both edit, so the CLI has to
      # keep producing entries the node container can actually parse.
      - name: The CLI maintains the exit node list
        run: |
          sudo bash saucewg.sh --dir /tmp/entry --yes add-node \
            --name ci-node --endpoint 198.51.100.10:51820 --public-key "$(head -c32 /dev/urandom | base64)" \
            --no-reload
          sudo jq -e '.[0].name == "ci-node" and (.[0].address | test("/32$"))' \
            /tmp/entry/config/exit-nodes.json >/dev/null
          sudo bash saucewg.sh --dir /tmp/entry --yes remove-node ci-node --no-reload
          sudo jq -e 'length == 0' /tmp/entry/config/exit-nodes.json >/dev/null
          echo "add-node and remove-node keep the list consistent"

      # Direct routes are the second list the node container reads, and a prefix it
      # cannot install is a route that silently does nothing.
      - name: The CLI maintains the direct route list
        run: |
          sudo bash saucewg.sh --dir /tmp/entry --yes add-route 142.250.0.0/15 8.8.8.8 \
            --note youtube --no-reload
          sudo jq -e '.[0].cidr == "142.250.0.0/15" and .[0].note == "youtube"' \
            /tmp/entry/config/direct-routes.json >/dev/null
          # A bare address is one host, and an address inside a range is the range:
          # the kernel rejects a route whose destination has host bits set.
          sudo jq -e '.[1].cidr == "8.8.8.8/32"' /tmp/entry/config/direct-routes.json >/dev/null
          sudo bash saucewg.sh --dir /tmp/entry --yes add-route 10.20.30.40/24 --no-reload
          sudo jq -e '.[2].cidr == "10.20.30.0/24"' /tmp/entry/config/direct-routes.json >/dev/null

          printf '# a generated list\n1.1.1.0/24\n\n9.9.9.9\n' > /tmp/routes.txt
          sudo bash saucewg.sh --dir /tmp/entry --yes add-route --from-file /tmp/routes.txt \
            --note dns --no-reload
          sudo jq -e '[.[] | select(.note == "dns")] | length == 2' \
            /tmp/entry/config/direct-routes.json >/dev/null

          # /0 is the cascade turned off rather than a route past it, and there is a
          # supported way to ask for that.
          ! sudo bash saucewg.sh --dir /tmp/entry --yes add-route 0.0.0.0/0 --no-reload
          ! sudo bash saucewg.sh --dir /tmp/entry --yes add-route youtube.com --no-reload

          sudo bash saucewg.sh --dir /tmp/entry --yes remove-route --note dns --no-reload
          sudo jq -e 'length == 3' /tmp/entry/config/direct-routes.json >/dev/null
          sudo bash saucewg.sh --dir /tmp/entry --yes remove-route 8.8.8.8 --no-reload
          sudo jq -e 'all(.[]; .cidr != "8.8.8.8/32")' /tmp/entry/config/direct-routes.json >/dev/null
          echo "add-route and remove-route keep the list routable"

      # The third list, for destinations no route can reach because the handshake to
      # them is what is being dropped. Unlike the other two an entry carries *how* to
      # reach the destination, so re-adding one has to correct it rather than be
      # skipped as a duplicate.
      - name: The CLI maintains the bypass list
        run: |
          sudo bash saucewg.sh --dir /tmp/entry --yes bypass add 203.0.113.0/24 \
            --note "some service" --no-reload
          sudo jq -e '.[0].cidr == "203.0.113.0/24" and .[0].enabled == true' \
            /tmp/entry/config/bypass.json >/dev/null
          sudo bash saucewg.sh --dir /tmp/entry --yes bypass add 198.51.100.7 \
            --v6 2001:db8::a --no-reload
          sudo jq -e '.[1].cidr == "198.51.100.7/32" and .[1].v6 == "2001:db8::a"' \
            /tmp/entry/config/bypass.json >/dev/null
          sudo bash saucewg.sh --dir /tmp/entry --yes bypass add 198.51.100.7 \
            --v6 2001:db8::ff --no-reload
          sudo jq -e 'length == 2 and .[1].v6 == "2001:db8::ff"' \
            /tmp/entry/config/bypass.json >/dev/null

          # A built-in group is shipped in the node image, so switching one of its
          # entries off can only be recorded here.
          sudo bash saucewg.sh --dir /tmp/entry --yes bypass add 91.108.56.0/22 \
            --disable --no-reload
          sudo jq -e '.[2].enabled == false' /tmp/entry/config/bypass.json >/dev/null

          ! sudo bash saucewg.sh --dir /tmp/entry --yes bypass add 0.0.0.0/0 --no-reload
          ! sudo bash saucewg.sh --dir /tmp/entry --yes bypass add telegram.org --no-reload
          ! sudo bash saucewg.sh --dir /tmp/entry --yes bypass add 1.2.3.4 --v6 not-v6 --no-reload
          ! sudo bash saucewg.sh --dir /tmp/entry --yes bypass nonsense

          sudo bash saucewg.sh --dir /tmp/entry --yes bypass remove 198.51.100.7 --no-reload
          sudo jq -e 'all(.[]; .cidr != "198.51.100.7/32")' /tmp/entry/config/bypass.json >/dev/null
          ! sudo bash saucewg.sh --dir /tmp/entry --yes bypass remove 10.0.0.0/8 --no-reload

          # The mode is read from the environment, so it has to reach the container.
          sudo bash saucewg.sh --dir /tmp/entry --yes bypass always --no-restart
          sudo docker compose --project-directory /tmp/entry \
            -f /tmp/entry/docker-compose.yml --env-file /tmp/entry/.env config --format json \
            | jq -e '.services.awg.environment.BYPASS_MODE == "always"' >/dev/null
          sudo bash saucewg.sh --dir /tmp/entry --yes bypass auto --no-restart
          echo "bypass keeps its list and its mode consistent"

      # One client seeding gets an exit server suspended, so the switch has to be on
      # from the moment a node is installed and has to stay where it was put. The
      # container reads the file, so what is asserted is the file — not a container.
      - name: The CLI maintains the torrent guard
        run: |
          sudo jq -e '.enabled == true and .mode == "on"' \
            /tmp/entry/config/torrent-block.json >/dev/null \
            || { echo "::error::a fresh install forwards torrents"; exit 1; }
          sudo jq -e '.enabled == true' /tmp/exit/config/torrent-block.json >/dev/null \
            || { echo "::error::a fresh exit node forwards torrents"; exit 1; }

          sudo bash saucewg.sh --dir /tmp/entry --yes torrents strict
          sudo jq -e '.mode == "strict"' /tmp/entry/config/torrent-block.json >/dev/null
          # The dial keeps its position while the switch is off, so turning it back
          # on does not silently drop the operator to the standard mode.
          sudo bash saucewg.sh --dir /tmp/entry --yes torrents off
          sudo jq -e '.enabled == false and .mode == "strict"' \
            /tmp/entry/config/torrent-block.json >/dev/null \
            || { echo "::error::switching off lost the chosen mode"; exit 1; }
          sudo bash saucewg.sh --dir /tmp/entry --yes torrents on
          sudo jq -e '.enabled == true and .mode == "on"' \
            /tmp/entry/config/torrent-block.json >/dev/null

          ! sudo bash saucewg.sh --dir /tmp/entry --yes torrents nonsense

          # Pinning it in the .env takes the switch away from the panel and the CLI
          # alike, and saying so is the whole point of the check.
          sudo sed -i 's/^TORRENT_BLOCK=.*/TORRENT_BLOCK=strict/' /tmp/entry/.env
          sudo bash saucewg.sh --dir /tmp/entry --yes torrents off \
            > /tmp/torrents.log 2>&1 \
            && { echo "::error::the CLI wrote a switch the container would ignore"; exit 1; }
          grep -q 'overrides this' /tmp/torrents.log \
            || { echo "::error::the CLI did not say why"; cat /tmp/torrents.log; exit 1; }
          sudo sed -i 's/^TORRENT_BLOCK=.*/TORRENT_BLOCK=/' /tmp/entry/.env

          # Reaching the .env is not reaching the container: the mount is what lets
          # the switch be changed without recreating it.
          sudo docker compose --project-directory /tmp/entry \
            -f /tmp/entry/docker-compose.yml --env-file /tmp/entry/.env config --format json \
            > /tmp/entry-compose.json
          jq -e '.services.awg.environment.TORRENT_BLOCK_FILE
                 == "/etc/amnezia/host/torrent-block.json"' /tmp/entry-compose.json >/dev/null \
            || { echo "::error::the container is not told where the switch is"; exit 1; }
          jq -e '[.services.awg.volumes[] | select(.target == "/etc/amnezia/host")] | length == 1' \
            /tmp/entry-compose.json >/dev/null \
            || { echo "::error::the switch is not mounted into the node container"; exit 1; }
          jq -e '.services.panel.environment.TORRENT_REGISTRY_FILE
                 == "/etc/saucewg/host/torrent-block.json"' /tmp/entry-compose.json >/dev/null \
            || { echo "::error::the panel cannot write the switch"; exit 1; }
          echo "torrents keeps its switch and its mode consistent"

      # An installation made before the fallback had two modes must come out of an
      # update with the new default written down rather than assumed. Only the .env
      # migration is under test, so docker is stubbed out: pulling three images to
      # find out what `update` writes into a text file would be a slow way to learn it.
      - name: Updating an older installation writes the fallback it will use
        run: |
          mkdir -p /tmp/shim && printf '#!/bin/sh\nexit 0\n' > /tmp/shim/docker
          chmod +x /tmp/shim/docker
          sudo bash saucewg.sh --dir /tmp/legacy --yes install \
            --endpoint-host 127.0.0.1 --admin-password ci-password --no-start
          sudo sed -i '/^CASCADE_FALLBACK=/d' /tmp/legacy/.env
          sudo env PATH=/tmp/shim:$PATH bash saucewg.sh --dir /tmp/legacy --yes update \
            --no-restart 2>&1 | tee /tmp/update.log
          sudo grep -qx 'CASCADE_FALLBACK=direct' /tmp/legacy/.env \
            || { echo "::error::update left the fallback unset"; exit 1; }
          grep -q 'leave through this entry node' /tmp/update.log \
            || { echo "::error::the change in behaviour was not announced"; exit 1; }

          # An operator who chose to block traffic keeps that choice.
          sudo bash saucewg.sh --dir /tmp/legacy --yes fallback block --no-restart
          sudo env PATH=/tmp/shim:$PATH bash saucewg.sh --dir /tmp/legacy --yes update --no-restart
          sudo grep -qx 'CASCADE_FALLBACK=block' /tmp/legacy/.env \
            || { echo "::error::update overwrote a deliberate choice"; exit 1; }
          echo "the fallback survives an update in both directions"

      # The bypass arrives the same way, and for the same reason: an installation
      # updated from before it existed has to come out with it configured, or the
      # destinations it exists to reopen stay unreachable with no sign of why.
      - name: Updating an older installation picks up the bypass
        run: |
          sudo rm -rf /tmp/nobypass
          sudo bash saucewg.sh --dir /tmp/nobypass --yes install \
            --endpoint-host 127.0.0.1 --admin-password ci-password --no-start
          sudo sed -i '/^BYPASS_/d' /tmp/nobypass/.env
          sudo env PATH=/tmp/shim:$PATH bash saucewg.sh --dir /tmp/nobypass --yes update \
            --no-restart 2>&1 | tee /tmp/bypass-update.log
          sudo grep -qx 'BYPASS_MODE=auto' /tmp/nobypass/.env \
            || { echo "::error::update left the bypass unset"; exit 1; }
          sudo grep -qx 'BYPASS_GROUPS=telegram' /tmp/nobypass/.env \
            || { echo "::error::update left the built-in group unset"; exit 1; }
          sudo grep -qx 'BYPASS_PARALLEL=6' /tmp/nobypass/.env \
            || { echo "::error::update left the handshake burst unset"; exit 1; }
          grep -q 'reopened while clients leave through this node' /tmp/bypass-update.log \
            || { echo "::error::the change in behaviour was not announced"; exit 1; }

          # Reaching the .env is not the same as reaching the container: the compose
          # file is regenerated by the same update and has to carry it too.
          sudo docker compose --project-directory /tmp/nobypass \
            -f /tmp/nobypass/docker-compose.yml --env-file /tmp/nobypass/.env config --format json \
            | jq -e '.services.awg.environment
                     | .BYPASS_MODE == "auto" and .BYPASS_GROUPS == "telegram"
                       and .BYPASS_PARALLEL == "6" and .BYPASS_ATTEMPTS == "96"' >/dev/null \
            || { echo "::error::the regenerated compose file does not pass the bypass through"; exit 1; }

          # An operator who turned it off keeps it off.
          sudo bash saucewg.sh --dir /tmp/nobypass --yes bypass off --no-restart
          sudo env PATH=/tmp/shim:$PATH bash saucewg.sh --dir /tmp/nobypass --yes update --no-restart
          sudo grep -qx 'BYPASS_MODE=off' /tmp/nobypass/.env \
            || { echo "::error::update overwrote a deliberate choice"; exit 1; }
          echo "the bypass arrives on update and survives being turned off"

      # Node recovery arrives the same way. An installation updated from before it
      # existed has to come out with the panel configured to use it, or a failed exit
      # node stays failed with nothing saying why.
      - name: Updating an older installation picks up node recovery
        run: |
          sudo sed -i '/^NODE_RECOVERY_/d' /tmp/nobypass/.env
          sudo env PATH=/tmp/shim:$PATH bash saucewg.sh --dir /tmp/nobypass --yes update \
            --no-restart 2>&1 | tee /tmp/recovery-update.log
          sudo grep -qx 'NODE_RECOVERY_ENABLED=true' /tmp/nobypass/.env \
            || { echo "::error::update left recovery unset"; exit 1; }
          grep -q 'instead of only routing around it' /tmp/recovery-update.log \
            || { echo "::error::the change in behaviour was not announced"; exit 1; }
          sudo docker compose --project-directory /tmp/nobypass \
            -f /tmp/nobypass/docker-compose.yml --env-file /tmp/nobypass/.env config --format json \
            | jq -e '.services.panel.environment.NODE_RECOVERY_ENABLED == "true"' >/dev/null \
            || { echo "::error::the regenerated compose file does not pass recovery through"; exit 1; }

          # An operator who turned it off keeps it off.
          sudo sed -i 's/^NODE_RECOVERY_ENABLED=.*/NODE_RECOVERY_ENABLED=false/' /tmp/nobypass/.env
          sudo env PATH=/tmp/shim:$PATH bash saucewg.sh --dir /tmp/nobypass --yes update --no-restart
          sudo grep -qx 'NODE_RECOVERY_ENABLED=false' /tmp/nobypass/.env \
            || { echo "::error::update overwrote a deliberate choice"; exit 1; }
          echo "node recovery arrives on update and survives being turned off"

      # Recovering an exit node happens inside the panel container, so the CLI's own
      # job is to reach it and to say so plainly when it cannot — a silent failure
      # here reads as "every node is fine".
      - name: recover says when it cannot reach the panel
        run: |
          sudo env PATH=/tmp/shim:$PATH bash saucewg.sh --dir /tmp/entry --yes recover \
            > /tmp/recover.log 2>&1 \
            && { echo "::error::recover reported success without a panel"; exit 1; }
          grep -q 'did not answer' /tmp/recover.log \
            || { echo "::error::recover failed without saying why"; cat /tmp/recover.log; exit 1; }
          echo "recover reports an unreachable panel"

      # `saucewg update` run as the installed command reads the file it would have to
      # overwrite, so it cannot deliver a newer CLI by copying — and the compose file and
      # the .env keys a release adds are written by the CLI, not by the images. Left to
      # itself that is a server running new containers configured by the old release, so
      # update fetches the published script and hands the run over to it.
      - name: Update replaces a stale CLI and finishes under the new one
        run: |
          mkdir -p /tmp/pub /tmp/bin
          printf '#!/bin/sh\nexit 0\n' > /tmp/bin/docker && chmod +x /tmp/bin/docker
          sudo cp saucewg.sh /tmp/bin/saucewg && sudo chmod +x /tmp/bin/saucewg
          sudo bash saucewg.sh --dir /tmp/stale --yes install \
            --endpoint-host 127.0.0.1 --admin-password ci-password --no-start
          # The migration the newer script is supposed to perform, undone so its arrival
          # is what puts it back.
          sudo sed -i '/^CASCADE_FALLBACK=/d' /tmp/stale/.env

          # tee, not a pipe into grep: what is being asserted happens *after* the run
          # announces the handover, and `grep -q` closing the pipe on that line kills
          # the run right there — which is the failure this test would then report.
          run() {
            sudo env PATH=/tmp/bin:$PATH SAUCEWG_CLI_PATH=/tmp/bin/saucewg \
              SAUCEWG_RAW_BASE="$1" /tmp/bin/saucewg --dir /tmp/stale --yes update \
              --no-restart 2>&1 | tee /tmp/self-update.log
          }
          said() { grep -q "$1" /tmp/self-update.log; }
          installed() { sed -n 's/^SAUCEWG_VERSION="\([^"]*\)".*/\1/p' /tmp/bin/saucewg | head -1; }

          sed 's/^SAUCEWG_VERSION="[^"]*"/SAUCEWG_VERSION="99.0.0"/' saucewg.sh > /tmp/pub/saucewg.sh
          run file:///tmp/pub
          said '99.0.0' || { echo "::error::a stale CLI updated silently"; exit 1; }
          [ "$(installed)" = 99.0.0 ] || { echo "::error::the CLI was not replaced"; exit 1; }
          sudo grep -qx 'CASCADE_FALLBACK=direct' /tmp/stale/.env \
            || { echo "::error::the newer script did not finish the update"; exit 1; }

          # An identical version is not swapped, and a mirror serving something that is
          # not this script leaves the working copy in place.
          sudo cp saucewg.sh /tmp/bin/saucewg
          cp saucewg.sh /tmp/pub/saucewg.sh
          run file:///tmp/pub
          said '→' && { echo "::error::replaced the CLI with its own version"; exit 1; }
          printf '<html>404</html>\nfi done )\n' > /tmp/pub/saucewg.sh
          run file:///tmp/pub
          said 'did not arrive intact' \
            || { echo "::error::a broken download was not reported"; exit 1; }
          [ "$(installed)" = "$(sed -n 's/^SAUCEWG_VERSION="\([^"]*\)".*/\1/p' saucewg.sh | head -1)" ] \
            || { echo "::error::a broken download clobbered the CLI"; exit 1; }
          echo "a stale CLI hands the update to the published one, and only to a sound one"
