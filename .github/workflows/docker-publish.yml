name: Publish images

# Builds the three SauceWG images and pushes them to Docker Hub.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account used to log in
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
#
# Optional repository variables:
#   DOCKERHUB_NAMESPACE  target namespace, defaults to DOCKERHUB_USERNAME
#   IMAGE_PREFIX         repository name prefix, defaults to "saucewg-"

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
      - '.env.exit.example'
  workflow_dispatch:
    inputs:
      platforms:
        description: Target platforms
        default: linux/amd64,linux/arm64
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: awg
            context: docker/awg
            dockerfile: docker/awg/Dockerfile
          # The panel image carries saucewg.sh, so it builds from the repository root.
          - name: panel
            context: .
            dockerfile: backend/Dockerfile
          - name: web
            context: .
            dockerfile: docker/caddy/Dockerfile

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify Docker Hub credentials are configured
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      # Only the amneziawg-tools stage is emulated; the Go and Node stages
      # cross-compile on the runner's native architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_PREFIX || 'saucewg-' }}${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=SauceWG ${{ matrix.name }}
            org.opencontainers.image.description=AmneziaWG legacy cascade — ${{ matrix.name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AWG_GO_REF=v0.2.19
            AWG_TOOLS_REF=v1.0.20260618-2
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
