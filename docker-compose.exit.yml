name: ${COMPOSE_PROJECT_NAME:-saucewg-exit}

# Exit node: a single AmneziaWG interface that terminates the cascade uplink from the
# entry node and NATs it out to the internet. No panel, no database.

services:
  awg:
    image: ${IMAGE_AWG:-saucewg/awg:1.4.0}
    build:
      context: ./docker/awg
      args:
        AWG_GO_REF: ${AWG_GO_REF:-v0.2.19}
        AWG_TOOLS_REF: ${AWG_TOOLS_REF:-v1.0.20260618-2}
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      AWG_ROLE: exit
      AWG_IFACE: ${AWG_IFACE:-awg0}
      AWG_PORT: ${AWG_PORT:-51820}
      AWG_SUBNET: ${AWG_SUBNET:-10.77.0.0/24}
      # This node's side of the IPv6 half of the bridge: what the entry node
      # reaches the IPv6 internet through. Empty carries IPv4 only, and the prefix
      # has to be the one the entry node has in CASCADE_UPLINK_SUBNET6. A node with
      # no IPv6 route of its own is not an error — the entry node reports its IPv6
      # as down rather than failing it over, because clients are IPv4.
      AWG_SUBNET6: ${AWG_SUBNET6:-}
      AWG_MTU: ${AWG_MTU:-1420}
      AWG_PRIVATE_KEY: ${AWG_PRIVATE_KEY:-}
      # 1.0, 1.5 or 2.0. The entry node has to be told which one this is, since both
      # ends of the uplink must pad and label packets the same way; `saucewg node-info`
      # prints the object that carries it.
      AWG_PROTOCOL: ${AWG_PROTOCOL:-}
      AWG_JC: ${AWG_JC:-}
      AWG_JMIN: ${AWG_JMIN:-}
      AWG_JMAX: ${AWG_JMAX:-}
      AWG_S1: ${AWG_S1:-}
      AWG_S2: ${AWG_S2:-}
      AWG_S3: ${AWG_S3:-}
      AWG_S4: ${AWG_S4:-}
      AWG_H1: ${AWG_H1:-}
      AWG_H2: ${AWG_H2:-}
      AWG_H3: ${AWG_H3:-}
      AWG_H4: ${AWG_H4:-}
      AWG_I1: ${AWG_I1:-}
      AWG_I2: ${AWG_I2:-}
      AWG_I3: ${AWG_I3:-}
      AWG_I4: ${AWG_I4:-}
      AWG_I5: ${AWG_I5:-}
      AWG_PEER_PUBLIC_KEY: ${AWG_PEER_PUBLIC_KEY:-}
      AWG_PEER_PSK: ${AWG_PEER_PSK:-}
      # Each entry-node uplink terminates on its own address inside this subnet, so
      # accepting the whole range keeps one exit image usable for any slot.
      #
      # AllowedIPs is the inbound filter as well as the route, so AWG_SUBNET6 is
      # appended to whatever is set here when the bridge carries IPv6 — otherwise
      # a node whose .env predates IPv6 would come up with an address on the bridge
      # and drop every packet carrying it.
      AWG_PEER_ALLOWED_IPS: ${AWG_PEER_ALLOWED_IPS:-10.77.0.0/24}
      WAN_IFACE: ${WAN_IFACE:-}
      # BitTorrent, blocked in the traffic this node forwards. This is the server
      # a swarm sees and the one a datacentre suspends over it, so the guard is
      # worth having here even when the entry node already runs it: what arrives
      # over an uplink is still in the clear on this side.
      TORRENT_BLOCK: ${TORRENT_BLOCK:-}
      TORRENT_BLOCK_FILE: ${TORRENT_BLOCK_FILE:-/etc/amnezia/host/torrent-block.json}
      TORRENT_TCP_PORTS: ${TORRENT_TCP_PORTS:-}
      TORRENT_UDP_PORTS: ${TORRENT_UDP_PORTS:-}
    volumes:
      - awg-config:/etc/amnezia/amneziawg
      - awg-run:/var/run/amneziawg
      # No panel here, so this only carries what an operator put in it by hand —
      # but it is what lets `saucewg torrents` change the setting on an exit node
      # without recreating the container.
      - ./config:/etc/amnezia/host:ro

volumes:
  awg-config:
  awg-run:
