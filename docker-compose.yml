name: ${COMPOSE_PROJECT_NAME:-saucewg}

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saucewg}
      POSTGRES_USER: ${POSTGRES_USER:-saucewg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saucewg} -d ${POSTGRES_DB:-saucewg}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  awg:
    <<: *restart
    image: ${IMAGE_AWG:-saucewg/awg:1.3.0}
    build:
      context: ./docker/awg
      args:
        AWG_GO_REF: ${AWG_GO_REF:-v0.2.19}
        AWG_TOOLS_REF: ${AWG_TOOLS_REF:-v1.0.20260618-2}
    # The node manages interfaces, routes and NAT for the host, so it shares the
    # host network namespace instead of running behind a bridge.
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      AWG_ROLE: entry
      AWG_IFACE: ${AWG_IFACE:-awg0}
      AWG_PORT: ${AWG_PORT:-51820}
      AWG_SUBNET: ${AWG_SUBNET:-10.8.0.0/24}
      AWG_MTU: ${AWG_MTU:-1420}
      AWG_PRIVATE_KEY: ${AWG_PRIVATE_KEY:-}
      # Which AmneziaWG generation this interface serves: 1.0, 1.5 or 2.0. Empty
      # keeps whatever the interface already recorded, which is how an upgrade avoids
      # moving live clients to a generation they do not speak.
      AWG_PROTOCOL: ${AWG_PROTOCOL:-}
      # Obfuscation. Anything left empty is generated once and then persisted, and the
      # parameters the generation does not carry are cleared rather than kept.
      AWG_JC: ${AWG_JC:-}
      AWG_JMIN: ${AWG_JMIN:-}
      AWG_JMAX: ${AWG_JMAX:-}
      AWG_S1: ${AWG_S1:-}
      AWG_S2: ${AWG_S2:-}
      # 2.0 only.
      AWG_S3: ${AWG_S3:-}
      AWG_S4: ${AWG_S4:-}
      AWG_H1: ${AWG_H1:-}
      AWG_H2: ${AWG_H2:-}
      AWG_H3: ${AWG_H3:-}
      AWG_H4: ${AWG_H4:-}
      # Signature packets, 1.5 and 2.0 only. A preset name (quic, dns, random, short,
      # none) or a literal spec; I2-I5 are optional extras.
      AWG_I1: ${AWG_I1:-}
      AWG_I2: ${AWG_I2:-}
      AWG_I3: ${AWG_I3:-}
      AWG_I4: ${AWG_I4:-}
      AWG_I5: ${AWG_I5:-}
      CASCADE_ENABLED: ${CASCADE_ENABLED:-true}
      # Generation for an uplink whose exit node does not name one. Left at 1.0 so an
      # existing cascade keeps working after an upgrade.
      CASCADE_PROTOCOL_DEFAULT: ${CASCADE_PROTOCOL_DEFAULT:-}
      CASCADE_MTU: ${CASCADE_MTU:-1380}
      CASCADE_KEEPALIVE: ${CASCADE_KEEPALIVE:-25}
      # What happens while no exit node is usable: `direct` carries client traffic out
      # of this entry node until one recovers, `block` drops it. Both are passed empty
      # by default so the node can tell "unset" from "chosen": an .env that predates
      # CASCADE_FALLBACK and asked for the kill switch keeps blocking.
      CASCADE_FALLBACK: ${CASCADE_FALLBACK:-}
      CASCADE_KILLSWITCH: ${CASCADE_KILLSWITCH:-}
      # The exit node list. CASCADE_NODES_JSON wins when set; otherwise the file is
      # read from the bind-mounted ./config directory.
      CASCADE_NODES_JSON: ${CASCADE_NODES_JSON:-}
      CASCADE_NODES_FILE: ${CASCADE_NODES_FILE:-/etc/amnezia/host/exit-nodes.json}
      # Destinations that bypass the cascade and leave through this entry node.
      # CASCADE_DIRECT_ROUTES wins when set; otherwise the file the panel edits is
      # read from the same bind-mounted ./config directory.
      CASCADE_DIRECT_ROUTES: ${CASCADE_DIRECT_ROUTES:-}
      CASCADE_DIRECT_FILE: ${CASCADE_DIRECT_FILE:-/etc/amnezia/host/direct-routes.json}
      # Destinations a censor blocks by dropping the TCP handshake to their IPv4
      # rather than by taking the route away, which no route can fix: this entry
      # node opens the outbound half itself, over the destination's IPv6 where one
      # is known and by dialling its IPv4 until a handshake lands otherwise.
      # `auto` engages only while client traffic is leaving through this node, since
      # a flow already going out through an exit node is not being filtered here.
      BYPASS_MODE: ${BYPASS_MODE:-auto}
      BYPASS_GROUPS: ${BYPASS_GROUPS:-telegram}
      BYPASS_ROUTES: ${BYPASS_ROUTES:-}
      BYPASS_FILE: ${BYPASS_FILE:-/etc/amnezia/host/bypass.json}
      BYPASS_PORT: ${BYPASS_PORT:-8646}
      BYPASS_ATTEMPTS: ${BYPASS_ATTEMPTS:-96}
      BYPASS_PARALLEL: ${BYPASS_PARALLEL:-6}
      # BitTorrent, blocked in the traffic this node forwards, because one client
      # seeding is an abuse notice and a suspended exit server. Empty leaves the
      # decision to the file the panel writes; off, on or strict here overrides it
      # and takes the switch out of the UI.
      TORRENT_BLOCK: ${TORRENT_BLOCK:-}
      TORRENT_BLOCK_FILE: ${TORRENT_BLOCK_FILE:-/etc/amnezia/host/torrent-block.json}
      # What `strict` still lets a client reach. Everything else is refused, which
      # is what closes encrypted peer traffic on a port nothing else uses.
      TORRENT_TCP_PORTS: ${TORRENT_TCP_PORTS:-}
      TORRENT_UDP_PORTS: ${TORRENT_UDP_PORTS:-}
      CASCADE_UPLINK_SUBNET: ${CASCADE_UPLINK_SUBNET:-10.77.0.0/24}
      # Failover tuning.
      CASCADE_PROBE_ENABLED: ${CASCADE_PROBE_ENABLED:-true}
      CASCADE_PROBE_TARGET: ${CASCADE_PROBE_TARGET:-1.1.1.1}
      CASCADE_PROBE_INTERVAL: ${CASCADE_PROBE_INTERVAL:-10}
      CASCADE_PROBE_TIMEOUT: ${CASCADE_PROBE_TIMEOUT:-3}
      CASCADE_FAIL_THRESHOLD: ${CASCADE_FAIL_THRESHOLD:-3}
      CASCADE_RECOVER_THRESHOLD: ${CASCADE_RECOVER_THRESHOLD:-2}
      CASCADE_HANDSHAKE_TIMEOUT: ${CASCADE_HANDSHAKE_TIMEOUT:-180}
      # Single-uplink variables, still honoured when no node list is present.
      CASCADE_ENDPOINT: ${CASCADE_ENDPOINT:-}
      CASCADE_ADDRESS: ${CASCADE_ADDRESS:-}
      CASCADE_PEER_PUBLIC_KEY: ${CASCADE_PEER_PUBLIC_KEY:-}
      CASCADE_PEER_PSK: ${CASCADE_PEER_PSK:-}
      CASCADE_PROTOCOL: ${CASCADE_PROTOCOL:-}
      CASCADE_JC: ${CASCADE_JC:-}
      CASCADE_JMIN: ${CASCADE_JMIN:-}
      CASCADE_JMAX: ${CASCADE_JMAX:-}
      CASCADE_S1: ${CASCADE_S1:-}
      CASCADE_S2: ${CASCADE_S2:-}
      CASCADE_S3: ${CASCADE_S3:-}
      CASCADE_S4: ${CASCADE_S4:-}
      CASCADE_H1: ${CASCADE_H1:-}
      CASCADE_H2: ${CASCADE_H2:-}
      CASCADE_H3: ${CASCADE_H3:-}
      CASCADE_H4: ${CASCADE_H4:-}
      CASCADE_I1: ${CASCADE_I1:-}
      CASCADE_I2: ${CASCADE_I2:-}
      CASCADE_I3: ${CASCADE_I3:-}
      CASCADE_I4: ${CASCADE_I4:-}
      CASCADE_I5: ${CASCADE_I5:-}
    volumes:
      - awg-config:/etc/amnezia/amneziawg
      - awg-run:/var/run/amneziawg
      - ./config:/etc/amnezia/host:ro

  panel:
    <<: *restart
    image: ${IMAGE_PANEL:-saucewg/panel:1.3.0}
    build:
      # The repository root, so the image can carry saucewg.sh and install exit
      # nodes with the same script an operator would run by hand.
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      awg:
        condition: service_started
    environment:
      PANEL_TITLE: ${PANEL_TITLE:-SauceWG}
      DEBUG: ${DEBUG:-false}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-saucewg}
      POSTGRES_USER: ${POSTGRES_USER:-saucewg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      AWG_IFACE: ${AWG_IFACE:-awg0}
      AWG_SUBNET: ${AWG_SUBNET:-10.8.0.0/24}
      AWG_ENDPOINT_HOST: ${AWG_ENDPOINT_HOST:?AWG_ENDPOINT_HOST must be set}
      AWG_ENDPOINT_PORT: ${AWG_PORT:-51820}
      CASCADE_ENABLED: ${CASCADE_ENABLED:-true}
      CASCADE_UPLINK_SUBNET: ${CASCADE_UPLINK_SUBNET:-10.77.0.0/24}
      CLIENT_DNS: ${CLIENT_DNS:-1.1.1.1, 1.0.0.1}
      CLIENT_MTU: ${CLIENT_MTU:-1280}
      CLIENT_ALLOWED_IPS: ${CLIENT_ALLOWED_IPS:-0.0.0.0/0, ::/0}
      CLIENT_KEEPALIVE: ${CLIENT_KEEPALIVE:-25}
      CLIENT_JC: ${CLIENT_JC:-0}
      CLIENT_JMIN: ${CLIENT_JMIN:-0}
      CLIENT_JMAX: ${CLIENT_JMAX:-0}
      # Signature packet handed to clients, when the generation has one. Empty mirrors
      # the server's own; a preset name or a literal spec overrides it.
      CLIENT_SIGNATURE: ${CLIENT_SIGNATURE:-}
      COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-10}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-30}
      ONLINE_TIMEOUT_SECONDS: ${ONLINE_TIMEOUT_SECONDS:-180}
      USAGE_BUCKET_MINUTES: ${USAGE_BUCKET_MINUTES:-60}
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-90}
      SUBSCRIPTION_URL_PREFIX: ${SUBSCRIPTION_URL_PREFIX:-}
      # Exit node management. The panel edits the same exit-nodes.json the node
      # container reads and then asks it to reload — no Docker socket needed.
      NODE_REGISTRY_FILE: ${NODE_REGISTRY_FILE:-/etc/saucewg/host/exit-nodes.json}
      # The direct route list, edited by the panel and read by the node container from
      # the other side of the same bind mount.
      ROUTES_REGISTRY_FILE: ${ROUTES_REGISTRY_FILE:-/etc/saucewg/host/direct-routes.json}
      BYPASS_REGISTRY_FILE: ${BYPASS_REGISTRY_FILE:-/etc/saucewg/host/bypass.json}
      # The torrent switch, on the panel's side of the same bind mount.
      TORRENT_REGISTRY_FILE: ${TORRENT_REGISTRY_FILE:-/etc/saucewg/host/torrent-block.json}
      NODE_PROVISION_ENABLED: ${NODE_PROVISION_ENABLED:-true}
      NODE_DEFAULT_PORT: ${NODE_DEFAULT_PORT:-51820}
      NODE_SSH_TIMEOUT_SECONDS: ${NODE_SSH_TIMEOUT_SECONDS:-900}
      NODE_SSH_QUERY_TIMEOUT_SECONDS: ${NODE_SSH_QUERY_TIMEOUT_SECONDS:-60}
      # The panel's own SSH key, enrolled on every node it installs so that later
      # calls — status, logs, restart, upgrade, repair — need no credentials.
      NODE_SSH_KEY_FILE: ${NODE_SSH_KEY_FILE:-/etc/saucewg/host/panel-ssh-key}
      NODE_SSH_KEY_ENABLED: ${NODE_SSH_KEY_ENABLED:-true}
      # Failover routes around a dead exit node; this is what tries to put it back,
      # with the key above. Off leaves a failed node for an operator.
      NODE_RECOVERY_ENABLED: ${NODE_RECOVERY_ENABLED:-true}
      NODE_RECOVERY_GRACE_SECONDS: ${NODE_RECOVERY_GRACE_SECONDS:-300}
      NODE_RECOVERY_INTERVAL_SECONDS: ${NODE_RECOVERY_INTERVAL_SECONDS:-60}
      NODE_RECOVERY_MAX_ATTEMPTS: ${NODE_RECOVERY_MAX_ATTEMPTS:-6}
      # Pins a node installed from the UI to the same release as this panel.
      SAUCEWG_REPO: ${SAUCEWG_REPO:-V2as/SauceWG}
      SAUCEWG_REF: ${SAUCEWG_REF:-main}
      SAUCEWG_NAMESPACE: ${SAUCEWG_NAMESPACE:-v2as}
      SAUCEWG_IMAGE_PREFIX: ${SAUCEWG_IMAGE_PREFIX:-saucewg-}
      SAUCEWG_TAG: ${SAUCEWG_TAG:-latest}
    volumes:
      - awg-config:/etc/amnezia/amneziawg:ro
      - awg-run:/var/run/amneziawg
      # Read-write: this is how a node added from the UI reaches the cascade.
      - ./config:/etc/saucewg/host
    networks: [internal]

  caddy:
    <<: *restart
    image: ${IMAGE_WEB:-saucewg/web:1.3.0}
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    depends_on: [panel]
    environment:
      PANEL_SITE_ADDRESS: ${PANEL_SITE_ADDRESS:-:80}
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-off}
    ports:
      - "${PANEL_HTTP_PORT:-8080}:80"
      - "${PANEL_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  awg-config:
  awg-run:
  caddy-data:
  caddy-config:
